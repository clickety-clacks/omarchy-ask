name: Release main tip

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version from manifest.json (without v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version manifest.json)" = "$VERSION"
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "v$VERSION already exists" >&2
            exit 1
          fi

      - name: Validate source
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and .id == "clickety-clacks.ask"
            and (.kinds | index("overlay"))
            and .entryPoints.overlay == "Ask.qml"' manifest.json >/dev/null
          node --check bridge/bridge.js
          node --check bridge/files.js
          node --check bridge/math.js
          node --check bridge/windows.js
          node --check bridge/reveal.js

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          target="$(git rev-parse HEAD)"
          gh release create "v$VERSION" \
            --target "$target" \
            --title "Omarchy Ask $VERSION" \
            --generate-notes
