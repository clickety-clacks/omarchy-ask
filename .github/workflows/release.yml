name: Release main tip

# Cuts a release from the tip of main and moves `stable` to it. `stable` is the
# repository's default branch, so it is what `omarchy plugin add` clones and
# `omarchy plugin update` follows: users get releases, while main is the
# everyday development branch. See AGENTS.md, "Branches and releases".
# Run with: gh workflow run release.yml --ref main -f version=X.Y.Z

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version from manifest.json (without v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version manifest.json)" = "$VERSION"
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "v$VERSION already exists" >&2
            exit 1
          fi
          # stable only ever moves forward to a released main commit.
          git fetch origin stable
          git merge-base --is-ancestor origin/stable HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bridge regression tests
        run: |
          npm ci --ignore-scripts --prefix bridge
          node --test bridge/harness-policy.test.js bridge/harness-errors.test.js \
            bridge/image-paste.test.js tests/compositor.test.mjs \
            tests/shortcut-policy.test.cjs tests/shortcut-platform.test.cjs

      - name: Validate source
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and .id == "clickety-clacks.ask"
            and (.kinds | index("overlay"))
            and .entryPoints.overlay == "Ask.qml"' manifest.json >/dev/null
          node --check bridge/bridge.js
          node --check bridge/files.js
          node --check bridge/math.js
          node --check bridge/windows.js
          node --check bridge/reveal.js
          node --check bridge/compositor.js
          node --check bridge/agentd-hub.js
          node --check bridge/file-search.js

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          target="$(git rev-parse HEAD)"
          notes=()
          if test -f "releases/$VERSION.md"; then
            notes=(--notes-file "releases/$VERSION.md")
          fi
          gh release create "v$VERSION" \
            --target "$target" \
            --title "Omarchy Ask $VERSION" \
            "${notes[@]}" \
            --generate-notes

      - name: Move stable to the release
        run: |
          set -euo pipefail
          # A plain push refuses anything but a fast-forward.
          git push origin "HEAD:refs/heads/stable"
